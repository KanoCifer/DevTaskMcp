[project]
name = "devtask-mcp"
version = "3.3.2"
description = "MCP server exposing your kanocifer.chat dev-task API as tools for agents (Task Document v3)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.5",
    "httpx[socks]>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devtask_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
